# appId stays as-is even though productName is now "iA Console". It is an internal identity
# Windows and macOS use to recognise the app across versions, not a display name — changing it
# would make every future release look like a different application. The copyright is the
# company's, which is correct; only the app's *name* stopped being the company's.
appId: com.infoanalytica.pgconsole
productName: iA Console
copyright: Copyright © InfoAnalytica

directories:
  output: release
  buildResources: build

# Ship only what the app actually loads at runtime: the bundled Electron main, the
# bundled server, the built SPA, and node_modules for the externals below.
files:
  - electron/dist/**
  - dist/**
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,tests,__tests__,example,examples,doc,docs}/**'

# These packages ship .node binaries or .wasm that cannot be loaded from inside an asar
# archive, and scripts/build-electron.mjs leaves them external — so they must exist as
# real files on disk. Keep this list in sync with the `external` array there.
asarUnpack:
  - '**/node_modules/@libpg-query/**'
  - '**/node_modules/@electric-sql/pglite/**'
  - '**/node_modules/@electric-sql/pglite-socket/**'
  - '**/node_modules/pg/**'
  - '**/node_modules/pg-*/**'
  - '**/node_modules/postgres/**'

win:
  # A real .ico, not the .png. Given only a PNG, electron-builder downloads a helper "icons"
  # bundle into %LOCALAPPDATA% to convert it, and on a locked-down Windows machine that download
  # dies with `EPERM ... rename icons-bundle-xxxx.tmp` when antivirus holds the temp file.
  # scripts/apply-brand.mjs packs the .ico itself, so no conversion and no download happens.
  icon: build/icon.ico
  # x64 only for now; add arm64 here if you need it.
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No artifactName here on purpose. A win-level template applies to every target, and both of
  # these emit .exe — so one name meant the portable build silently overwrote the installer,
  # leaving a file that installs nothing, creates no Start Menu entry, and has to be re-run to
  # launch the app. Each target names itself below instead.

nsis:
  # "Setup" in the name so the installer is unmistakable when it is shared with someone.
  # Space-free on purpose: productName is "iA Console", and a filename with a space in it
  # is awkward to share, download and script around.
  artifactName: 'iA-Console-Setup-${version}-${arch}.${ext}'
  oneClick: false
  # Per-user install, so it needs no admin rights. Shortcuts land in the user's own Start Menu.
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: iA Console

portable:
  # Runs from wherever it sits and installs nothing — useful for a quick look, but it is NOT
  # what you hand to someone who expects to install the app. Named so the two cannot be mixed up.
  artifactName: 'iA-Console-Portable-${version}-${arch}.${ext}'

# macOS and Linux are configured but untested — Windows is the requested target.
mac:
  target: [dmg]
  category: public.app-category.developer-tools

linux:
  target: [AppImage]
  category: Development
  # Linux defaults executableName to package.json `name`, which is scoped — without this
  # the binary is named "@pgplexpgconsole". Windows and macOS use productName already.
  executableName: ia-console
