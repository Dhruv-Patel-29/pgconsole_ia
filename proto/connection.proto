syntax = "proto3";

package connection.v1;

service ConnectionService {
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc GetConnection(GetConnectionRequest) returns (GetConnectionResponse);
  rpc TestConnection(TestConnectionRequest) returns (TestConnectionResponse);
  // Test unsaved form input, before the connection exists. pgAdmin's behaviour;
  // distinct from TestConnection, which tests a saved connection by id.
  rpc TestConnectionParams(TestConnectionParamsRequest) returns (TestConnectionResponse);
  rpc CreateConnection(CreateConnectionRequest) returns (CreateConnectionResponse);
  rpc UpdateConnection(UpdateConnectionRequest) returns (UpdateConnectionResponse);
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);
  // Databases on the server behind a connection. Only populated when the connection
  // opted into all_databases; otherwise returns just the configured database.
  rpc ListDatabases(ListDatabasesRequest) returns (ListDatabasesResponse);
  rpc ListConnectionGroups(ListConnectionGroupsRequest) returns (ListConnectionGroupsResponse);
  rpc UpsertConnectionGroup(UpsertConnectionGroupRequest) returns (UpsertConnectionGroupResponse);
  rpc DeleteConnectionGroup(DeleteConnectionGroupRequest) returns (DeleteConnectionGroupResponse);
}

message Label {
  string id = 1;
  string name = 2;
  string color = 3;
}

message Connection {
  string id = 1;
  string name = 2;
  string description = 3;
  string host = 4;
  int32 port = 5;
  string database = 6;   // the maintenance/default database
  string username = 7;
  bool has_password = 8;
  string ssl_mode = 9;
  repeated Label labels = 10;
  string version = 11; // PostgreSQL version (e.g., "16")
  repeated string permissions = 12;
  string color = 13; // Optional per-connection environment tint (hex)
  // "toml" (operator-managed, read-only here) or "store" (editable from the UI).
  string source = 14;
  string group_id = 15;
  // Browse every database on this server rather than just `database`.
  bool all_databases = 16;
  string ssl_ca = 17;
  string ssl_cert = 18;
  string ssl_key = 19;
  string lock_timeout = 20;
  string statement_timeout = 21;
}

message ConnectionGroup {
  string id = 1;
  string name = 2;
  int32 sort_order = 3;
}

// Shared shape for create and update. password is write-only: send it to set or change
// one, omit it to keep the stored one, send "" to clear it.
message ConnectionInput {
  string id = 1;
  string name = 2;
  string host = 3;
  int32 port = 4;
  string database = 5;
  string username = 6;
  optional string password = 7;
  string ssl_mode = 8;
  string ssl_ca = 9;
  string ssl_cert = 10;
  string ssl_key = 11;
  string lock_timeout = 12;
  string statement_timeout = 13;
  string color = 14;
  string group_id = 15;
  repeated string labels = 16;
  bool all_databases = 17;
}

message CreateConnectionRequest {
  ConnectionInput connection = 1;
}

message CreateConnectionResponse {
  Connection connection = 1;
}

message UpdateConnectionRequest {
  ConnectionInput connection = 1;
}

message UpdateConnectionResponse {
  Connection connection = 1;
}

message DeleteConnectionRequest {
  string id = 1;
}

message DeleteConnectionResponse {}

// Unsaved connection parameters. Set `id` to an existing connection to reuse its stored
// password without sending the secret back to the server.
message TestConnectionParamsRequest {
  string host = 1;
  int32 port = 2;
  string database = 3;
  string username = 4;
  optional string password = 5;
  string ssl_mode = 6;
  string id = 7;
}

message ListDatabasesRequest {
  string connection_id = 1;
}

message ListDatabasesResponse {
  repeated string databases = 1;
}

message ListConnectionGroupsRequest {}

message ListConnectionGroupsResponse {
  repeated ConnectionGroup groups = 1;
}

message UpsertConnectionGroupRequest {
  ConnectionGroup group = 1;
}

message UpsertConnectionGroupResponse {
  ConnectionGroup group = 1;
}

message DeleteConnectionGroupRequest {
  string id = 1;
}

message DeleteConnectionGroupResponse {}

message ListConnectionsRequest {}

message ListConnectionsResponse {
  repeated Connection connections = 1;
}

message GetConnectionRequest {
  string id = 1;
}

message GetConnectionResponse {
  Connection connection = 1;
}

message TestConnectionRequest {
  string id = 1;
}

message TestConnectionResponse {
  bool success = 1;
  string error = 2;
  int32 latency_ms = 3;
}
